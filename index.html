<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --red:#fc2a2a; --ink:#141414; }
  * { box-sizing:border-box; }
  html { background:#e9e9e9; }
  body {
    margin:0; font-family:Inter, Arial, sans-serif; color:var(--ink);
    background:repeating-linear-gradient(0deg, #e4e4e4 0 2px, #f3f3f3 2px 6px);
    min-height:100vh;
  }
  .sheet {
    max-width:680px; margin:0 auto; position:relative;
    container-type:inline-size;
    background:repeating-linear-gradient(90deg, #e6e6e6 0 1px, #fafafa 1px 4px);
  }

  /* ---------- header: one scalable picture ---------- */
  .head { position:relative; display:block; }
  .head svg { display:block; width:100%; height:auto; }
  .intro {
    position:absolute; left:35.6%; top:2.6cqw; width:31%;
    font-size:clamp(10.5px, 2.25cqw, 15px); line-height:1.3; margin:0;
  }
  @container (max-width: 480px) { .intro { width:27%; left:35%; top:2cqw; } }

  /* names: tucked beside her hand on wider screens, inside the form on phones */
  .names label { display:block; text-transform:uppercase; font-size:clamp(13px, 2.6cqw, 17px); margin:0 0 .25em; }
  .names input { margin-bottom:.7em; }

  @container (min-width: 560px) {
    .names { position:absolute; left:-1.2cqw; top:-28.8cqw; width:28.6cqw; z-index:3; }
    .names label { font-size:2.3cqw; margin-bottom:.15em; }
    .names input { padding:.22em .5em; font-size:2.2cqw; margin-bottom:.9cqw; border-radius:6px; }
  }

  /* ---------- the card she is holding ---------- */
  .card {
    position:relative;
    margin-top:0;
    border:solid var(--red);
    border-width:0 calc(100cqw * 6 / 595) calc(100cqw * 12 / 595) calc(100cqw * 14 / 595);
    border-radius:0 0 3.2cqw 2.4cqw;
    background:repeating-linear-gradient(180deg, #ececec 0 calc(100cqw * 2 / 595), #f4f4f4 calc(100cqw * 2 / 595) calc(100cqw * 6 / 595));
    padding:0 3.2cqw 4cqw 2.2cqw;
  }
  .q { margin:0 0 clamp(16px, 3.4cqw, 24px); }
  .q label, .clsrow label { display:block; font-size:clamp(15px, 2.75cqw, 18px); line-height:1.35; margin-bottom:.45em; }
  .lower { width:60%; }
  @container (max-width: 420px) { .lower { width:62%; } }

  input, textarea, select {
    width:100%; font:inherit; font-size:16px; color:var(--ink);
    background:rgba(255,255,255,.95); border:1.5px solid #cfcfcf; border-radius:8px; padding:9px 11px;
  }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(252,42,42,.15); }
  textarea { resize:vertical; min-height:78px; line-height:1.4; }
  .clsrow { margin-bottom:clamp(16px, 3.4cqw, 24px); }

  .detective {
    position:absolute; right:calc(-100cqw * 6 / 595); bottom:calc(-100cqw * 12 / 595);
    width:38cqw; pointer-events:none; z-index:2;
  }

  button {
    font:inherit; font-weight:700; font-size:clamp(15px, 2.8cqw, 18px);
    background:var(--red); color:#fff; border:none; border-radius:999px;
    padding:.8em 1.5em; cursor:pointer; box-shadow:0 3px 0 #b31717;
  }
  button:disabled { opacity:.55; cursor:default; }
  .actions { display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin-top:4px; }
  .msg { font-size:15px; }
  .msg.err { color:#b3141b; font-weight:600; }

  .done { display:none; text-align:center; padding:12cqw 6cqw 50cqw; position:relative; }
  .done h2 { font-size:clamp(28px, 6cqw, 40px); color:var(--red); margin:0 0 10px; transform:rotate(-3deg); }

  .spacer { height:clamp(40px, 9cqw, 70px); }
</style>
</head>

var TEACHER_EMAIL = "robisapaci@gmail.com";
/* ========================================================= */
(function () {
  var form = document.getElementById('f');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('send');
  var KEY = 'partner-interview-draft';

  // Keep a draft on this device so a refresh doesn't wipe answers.
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    Object.keys(saved).forEach(function (k) { if (form.elements[k]) form.elements[k].value = saved[k]; });
  } catch (e) {}
  form.addEventListener('input', function () {
    try {
      var d = {};
      Array.prototype.forEach.call(form.elements, function (el) { if (el.name && el.name !== 'website') d[el.name] = el.value; });
      localStorage.setItem(KEY, JSON.stringify(d));
    } catch (e) {}
  });

  function labelFor(el) {
    var l = form.querySelector('label[for="' + el.id + '"]');
    return l ? l.textContent.replace(/:$/, '').trim() : el.name;
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    msg.className = 'msg'; msg.textContent = '';
    var name = form.elements.name.value.trim();
    var partner = form.elements.partner.value.trim();
    var cls = form.elements.cls.value;
    if (!name || !partner || !cls) {
      msg.className = 'msg err';
      msg.textContent = 'Please fill in your name, your partner\'s name and your class (at the top).';
      form.elements[!name ? 'name' : !partner ? 'partner' : 'cls'].focus();
      return;
    }
    btn.disabled = true; btn.textContent = 'Sending...';
    var data = { _subject: 'Partner interview: ' + name + ' (' + cls + ')', _template: 'table', _captcha: 'false' };
    Array.prototype.forEach.call(form.elements, function (el) {
      if (el.name && el.name !== 'website') data[labelFor(el)] = el.value.trim();
    });
    fetch('https://formsubmit.co/ajax/' + TEACHER_EMAIL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(data)
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (res) {
        if (!(res.success === true || res.success === 'true')) throw new Error(res.message || 'failed');
        try { localStorage.removeItem(KEY); } catch (e) {}
        form.style.display = 'none';
        document.getElementById('done').style.display = 'block';
        window.scrollTo(0, 0);
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Submit to your teacher';
        msg.className = 'msg err';
        msg.textContent = 'That didn\'t send. Check your internet and try again. Your answers are still here.';
        document.getElementById('copybox').style.display = 'block';
      });
  });

  // Plan B: copy everything as text to send another way.
  document.getElementById('copy').addEventListener('click', function () {
    var lines = [];
    Array.prototype.forEach.call(form.elements, function (el) {
      if (el.name && el.name !== 'website') lines.push(labelFor(el) + '\n' + el.value.trim() + '\n');
    });
    var text = lines.join('\n');
    var done = function () { document.getElementById('copy').textContent = 'Copied!'; };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    else { fallbackCopy(text); done(); }
  });
})();
</script>
</body>
</html>
